# SACHIZU LAB on Fly.io: the static public app, as on GitHub Pages (no extra headers that would change how it runs).
# Hashed scripts, styles and WebAssembly are kept a year, the models a week (the app also keeps them on the device), the
# page itself is checked every time. Compression is Fly's proxy's: it compresses text and WebAssembly for the browser
# (br 7.2 MB, gzip 9.3 MB for the 27 MB WebAssembly), and nginx leaves requests that came through it (Via) as they are
# (gzip_proxied off), so no compression runs on this small machine; gzip below is only for a request made to it directly.
server {
  listen 8080;
  server_tokens off;
  root /usr/share/nginx/html;
  index index.html;
  # UTF-8 named on the page, scripts, styles and text, as GitHub Pages does (the notices are partly Japanese).
  charset utf-8;
  charset_types text/html text/css text/plain text/markdown application/javascript application/json image/svg+xml;
  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types text/css application/javascript text/javascript application/json application/wasm image/svg+xml text/plain;
  add_header X-Content-Type-Options nosniff always;

  location = /index.html { add_header Cache-Control "no-cache" always; add_header X-Content-Type-Options nosniff always; }
  location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable" always; add_header X-Content-Type-Options nosniff always; }
  location /models/ { add_header Cache-Control "public, max-age=604800" always; add_header X-Content-Type-Options nosniff always; }
  # The notices and model READMEs read as text, as on GitHub Pages.
  location ~ \.md$ { default_type text/markdown; add_header X-Content-Type-Options nosniff always; }
}
